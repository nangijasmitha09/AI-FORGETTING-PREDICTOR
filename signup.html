<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>RecallAI | Create Account</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body class="auth-page">

<div class="auth-card">

    <div class="logo">🧠</div>

    <h1>Create your account</h1>

    <p>Start predicting what you're about to forget.</p>

    {% if error %}
        <div class="error">
            {{ error }}
        </div>
    {% endif %}

    <form method="POST">

        <label>Name</label>

        <input
            type="text"
            name="name"
            placeholder="Your name"
            required
        >

        <label>Email</label>

        <input
            type="email"
            name="email"
            placeholder="you@example.com"
            required
        >

        <label>Password</label>

        <input
            type="password"
            name="password"
            placeholder="Minimum 6 characters"
            required
        >

        <label>Confirm Password</label>

        <input
            type="password"
            name="confirm_password"
            placeholder="Enter password again"
            required
        >

        <button type="submit">
            Create Account
        </button>

    </form>

    <div class="auth-link">

        Already have an account?

        <a href="/login">
            Sign In
        </a>

    </div>

</div>

</body>
</html>
