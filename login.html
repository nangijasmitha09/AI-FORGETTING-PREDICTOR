<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RecallAI | Sign In</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="auth-page">

<div class="auth-card">

    <div class="logo">🧠</div>

    <h1>Welcome back</h1>

    <p>Sign in to continue your learning journey.</p>

    {% if error %}
        <div class="error">
            {{ error }}
        </div>
    {% endif %}

    <form method="POST">

        <label>Email</label>

        <input
            type="email"
            name="email"
            placeholder="you@example.com"
            required
        >

        <label>Password</label>

        <input
            type="password"
            name="password"
            placeholder="Your password"
            required
        >

        <button type="submit">
            Sign In
        </button>

    </form>

    <div class="auth-link">

        Don't have an account?

        <a href="/signup">
            Create account
        </a>

    </div>

</div>

</body>
</html>
